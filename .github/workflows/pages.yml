# Publica a versão web (conectada ao Supabase) no GitHub Pages a cada push na main.
# Ative uma vez em: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Gerar a versão web
        run: npx expo export --platform web --output-dir dist
        env:
          KISSLY_BASE_URL: /${{ github.event.repository.name }}
          # Chave publicável: feita para ficar no app (a segurança está nas regras RLS do banco).
          # Nunca coloque aqui a Secret key / service_role.
          EXPO_PUBLIC_SUPABASE_URL: https://mxrxdvnvoobtroetmopr.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_hxMs1PfsPsLIVNkIklltSg_RgBD-4tV
          # Chave do GIPHY (feita para ficar no app; limite "beta": 100 buscas/hora).
          EXPO_PUBLIC_GIPHY_API_KEY: xg5dUDPoEYXfHeA0b66JyCxKUT7a0Yco
      # O Pages não conhece as rotas do app: o 404.html devolve o app em qualquer endereço.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
